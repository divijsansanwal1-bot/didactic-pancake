<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesla Gaming Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17122b; --surface:#221b3f; --surface2:#2d2552; --line:#3b3166;
  --text:#f3efff; --muted:#a79fcb; --spark:#ffc83d; --spark-ink:#2a1f00;
  --good:#6fe3b5; --bad:#ff7a8a; --glow:rgba(255,200,61,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f6f3ff; --surface:#ffffff; --surface2:#eee9ff; --line:#d9d1f5;
  --text:#1e1740; --muted:#6b6396; --spark:#e8a400; --spark-ink:#231800;
  --good:#12805a; --bad:#c2314a; --glow:rgba(232,164,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,.num{font-family:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;margin:0}
main{max-width:520px;margin:0 auto;padding:18px 18px 110px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.top h1{font-size:19px;font-weight:700;letter-spacing:.01em}
.top .date{color:var(--muted);font-size:14px}
.icon-btn{color:var(--muted);padding:6px 10px;border-radius:8px;font-size:14px}
.icon-btn:hover{background:var(--surface2)}

/* hero count */
.hero{padding:6px 0 18px}
.count{display:flex;align-items:baseline;gap:10px}
.count .big{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:92px;line-height:.95;color:var(--spark)}
.count .of{font-size:18px;color:var(--muted)}
.status{margin:8px 0 14px;color:var(--muted)}
.status b{color:var(--text);font-weight:600}
.bolts{display:flex;gap:7px;margin:0 6px 18px 4px}
.bolt{flex:1;height:34px;background:var(--surface2);transform:skewX(-16deg);border-radius:3px;border:1px solid var(--line)}
.bolt.on{background:var(--spark);border-color:var(--spark);box-shadow:0 0 14px var(--glow)}
@media (prefers-reduced-motion:no-preference){
  .bolt.fresh{animation:zap .55s ease-out}
}
@keyframes zap{0%{filter:brightness(2.4);transform:skewX(-16deg) scaleY(1.45)}100%{filter:none;transform:skewX(-16deg) scaleY(1)}}

.btn{display:block;width:100%;padding:14px 16px;border-radius:10px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:17px;text-align:center}
.btn.primary{background:var(--spark);color:var(--spark-ink)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:500}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);font-weight:500}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

.stats{display:flex;gap:22px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0}
.stat .num{font-size:28px;font-weight:700;line-height:1.1}
.stat span{display:block;color:var(--muted);font-size:13px}

section{margin-top:26px}
section>h2{font-size:17px;font-weight:700;margin-bottom:8px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.empty{color:var(--muted);padding:14px;background:var(--surface);border-radius:12px;border:1px dashed var(--line)}

.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13.5px}
.row .r{text-align:right;white-space:nowrap}
.row .r .num{font-size:18px;font-weight:700}
.row .r .add{color:var(--spark);font-size:14px}
.dayhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:20px 0 2px}
.dayhead b{color:var(--text);font-weight:600}

label{display:block;color:var(--muted);font-size:14px;margin:12px 0 0}
input[type=text],input[type=number],input[type=date],input:not([type]),textarea{width:100%;margin-top:5px;padding:11px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:70px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{margin:14px 0 2px}
.check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:16px;margin:0;padding:8px 0}
.check input{width:22px;height:22px;accent-color:var(--spark);margin:0}

.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:10px;background:var(--surface2);font-size:22px;font-family:'Chakra Petch',sans-serif}
.stepper .num{font-size:30px;font-weight:700;min-width:48px;text-align:center}

.insight{padding:12px 0;border-bottom:1px solid var(--line)}
.insight b{font-weight:600}
.insight .v{font-family:'Chakra Petch',sans-serif;font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)}

.bigdays{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.bigdays .num{font-size:78px;font-weight:700;color:var(--spark);line-height:1}
.bar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--spark);border-radius:6px}
.barlabel{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:10px;background:var(--surface2);font-size:15px;border:1px solid var(--line)}
.seg button.on{background:var(--spark);color:var(--spark-ink);border-color:var(--spark);font-weight:600}
.sparkline{width:100%;height:60px;margin:8px 0 0;display:block}
.big-need{font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;padding:14px 4px 13px;color:var(--muted);font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:16px;border-top:3px solid transparent}
nav button.on{color:var(--spark);border-top-color:var(--spark)}

.overlay{position:fixed;inset:0;background:rgba(8,5,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h2{font-size:21px;margin-bottom:2px}
pre.export{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:280px;overflow:auto;font-size:12.5px;white-space:pre;margin:10px 0 0;color:var(--text)}
.note{color:var(--muted);font-size:13.5px;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="in" id="nav">
  <button data-tab="today">Today</button>
  <button data-tab="log">Log</button>
  <button data-tab="goal">Goal</button>
</div></nav>
<div class="overlay" id="overlay" hidden></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY='tesla-gaming-tracker-v1';
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);}
function today(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){
  if(n==null||isNaN(n))return '–';
  n=Math.round(n);
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e4)return Math.round(n/1e3)+'k';
  if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function fmtDay(s){return parse(s).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});}
function fmtLong(s){return parse(s).toLocaleDateString([], {month:'long',day:'numeric'});}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}

/* ---------- state ---------- */
function defaults(){
  return {
    settings:{goal:7,deadline:'2027-01-15',target:10000000,series:'',theme:'dark'},
    shorts:[],
    subs:[{date:today(),count:30}],
    clips:0,
    nextHero:'',
    wins:{},
    studioViews:45000
  };
}
var memStore=null;
function load(){
  var d=defaults(),src=null,raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{src=JSON.parse(raw);}catch(e){src=null;}}
  else if(memStore){src=memStore;}
  if(src){
    var s=Object.assign({},d.settings,src.settings||{});
    d=Object.assign(d,src);
    d.settings=s;
    if(!Array.isArray(d.shorts))d.shorts=[];
    if(!Array.isArray(d.subs))d.subs=[];
    if(!d.wins||typeof d.wins!=='object')d.wins={};
  }
  return d;
}
var S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  try{memStore=JSON.parse(JSON.stringify(S));}catch(e){}
}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme==='light'?'light':'dark');}

var tab='today';
var flash=false;

/* ---------- derived data ---------- */
function countsByDate(){
  var c={};
  S.shorts.forEach(function(x){c[x.date]=(c[x.date]||0)+1;});
  return c;
}
function streaks(){
  var c=countsByDate(),g=S.settings.goal;
  function hit(d){return (c[d]||0)>=g;}
  var cur=0,d=today();
  if(!hit(d))d=addDays(d,-1);
  while(hit(d)){cur++;d=addDays(d,-1);}
  var days=Object.keys(c).filter(hit).sort(),best=0,run=0,prev=null;
  days.forEach(function(x){
    run=(prev&&addDays(prev,1)===x)?run+1:1;
    if(run>best)best=run;
    prev=x;
  });
  return {cur:cur,best:best};
}
function currentSubs(){
  if(!S.subs.length)return null;
  var s=S.subs.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  return s[s.length-1].count;
}
function loggedViews(fromDate){
  return S.shorts.filter(function(x){return x.views!=null&&x.date>=fromDate;})
    .reduce(function(a,x){return a+x.views;},0);
}
function views90(){
  return S.studioViews!=null?S.studioViews:loggedViews(addDays(today(),-90));
}
function nextNum(series){
  var s=(series||'').trim().toLowerCase();
  var nums=S.shorts.filter(function(x){return (x.series||'').trim().toLowerCase()===s&&x.num;}).map(function(x){return x.num;});
  return nums.length?Math.max.apply(null,nums)+1:1;
}

/* ---------- views ---------- */
function shortRow(x){
  var checks=(x.q||[]).filter(Boolean).length;
  var name=x.title?esc(x.title):'Short'+(x.num?' #'+x.num:'');
  var sub=[x.series?esc(x.series)+(x.num?' #'+x.num:''):'',x.hero?esc(x.hero):'',fmtTime(x.ts),checks+'/3 checks'].filter(Boolean).join(', ');
  var right=x.views!=null
    ?'<div class="r"><div class="num">'+fmt(x.views)+'</div><div class="s">'+(x.avp!=null?x.avp+'% viewed':'views')+'</div></div>'
    :'<div class="r"><span class="add">Add results</span></div>';
  return '<button class="row" data-act="edit" data-id="'+x.id+'"><div><div class="t">'+name+'</div><div class="s">'+sub+'</div></div>'+right+'</button>';
}

function viewToday(){
  var t=today(),g=S.settings.goal;
  var list=S.shorts.filter(function(x){return x.date===t;}).sort(function(a,b){return a.ts-b.ts;});
  var n=list.length,st=streaks();
  var bolts='';
  for(var i=0;i<g;i++){
    var on=i<n,fresh=flash&&i===Math.min(n,g)-1;
    bolts+='<div class="bolt'+(on?' on':'')+(fresh?' fresh':'')+'"></div>';
  }
  flash=false;
  var status;
  if(n>=g)status='<b>Goal hit.</b> '+(n>g?(n-g)+' over. ':'')+'Streak is '+st.cur+' day'+(st.cur===1?'':'s')+'.';
  else if(n===0)status='<b>Nothing posted yet.</b> Log your first Short and the day is started.';
  else status='<b>'+(g-n)+' to go</b> for today.';
  var left=diff(t,S.settings.deadline);
  var win=S.wins[t]||'';
  return ''+
  '<div class="top"><h1>Tesla Gaming</h1><div><span class="date">'+fmtDay(t)+'</span> <button class="icon-btn" data-act="settings">Settings</button></div></div>'+
  '<div class="hero"><div class="count"><span class="big">'+n+'</span><span class="of">of '+g+' today</span></div>'+
  '<div class="status">'+status+'</div><div class="bolts">'+bolts+'</div>'+
  '<button class="btn primary" data-act="log">Log a Short</button></div>'+
  '<div class="stats">'+
    '<div class="stat"><div class="num">'+st.cur+'</div><span>day streak</span></div>'+
    '<div class="stat"><div class="num">'+st.best+'</div><span>best streak</span></div>'+
    '<div class="stat"><div class="num">'+(left>0?left:0)+'</div><span>days to '+fmtLong(S.settings.deadline)+'</span></div>'+
  '</div>'+
  '<section><h2>Posted today</h2>'+(list.length?list.map(shortRow).join(''):'<div class="empty">Your Shorts for today will show up here. Tap a Short later to add its views.</div>')+'</section>'+
  '<section><h2>Plan for tomorrow</h2>'+
    '<label>Tomorrow\u2019s hero<input id="p-hero" value="'+esc(S.nextHero)+'" placeholder="Use it in today\u2019s follow line"></label>'+
    '<label>Clips left in the bank</label>'+
    '<div class="stepper"><button data-act="clip" data-d="-1" aria-label="One fewer clip">\u2212</button><span class="num" id="clipnum">'+S.clips+'</span><button data-act="clip" data-d="1" aria-label="One more clip">+</button></div>'+
    '<label>One win from today<textarea id="p-win" placeholder="What worked, even if it was small?">'+esc(win)+'</textarea></label>'+
  '</section>';
}

function insights(){
  var scored=S.shorts.filter(function(x){return x.views!=null;});
  if(scored.length<2)return '<div class="empty">Add views to a few Shorts and your best and worst, hero results, and the first 3 vs last 3 comparison will appear here.</div>';
  var h='';
  var sorted=scored.slice().sort(function(a,b){return b.views-a.views;});
  function name(x){return esc(x.title||((x.series?x.series+' ':'Short ')+(x.num?'#'+x.num:'')).trim());}
  function line(x){return '<div class="s">'+name(x)+' <span class="v">'+fmt(x.views)+'</span>'+(x.avp!=null?', '+x.avp+'% viewed':'')+'</div>';}
  h+='<div class="insight"><b class="good">Top Shorts</b>'+sorted.slice(0,3).map(line).join('')+'</div>';
  if(scored.length>=4){
    h+='<div class="insight"><b class="bad">Lowest Shorts</b>'+sorted.slice(-3).reverse().map(line).join('')+'</div>';
  }
  var by={};
  scored.forEach(function(x){var k=(x.hero||'').trim().toLowerCase();if(!k)return;(by[k]=by[k]||{n:x.hero.trim(),v:[]}).v.push(x.views);});
  var heroes=Object.keys(by).map(function(k){return {n:by[k].n,a:avg(by[k].v),c:by[k].v.length};}).filter(function(x){return x.c>=2;}).sort(function(a,b){return b.a-a.a;});
  if(heroes.length){
    h+='<div class="insight"><b>Best hero so far</b><div class="s">'+esc(heroes[0].n)+' averages <span class="v">'+fmt(heroes[0].a)+'</span> views over '+heroes[0].c+' Shorts.</div></div>';
  }
  var byDay={};
  scored.forEach(function(x){(byDay[x.date]=byDay[x.date]||[]);});
  var firsts=[],lasts=[];
  Object.keys(countsByDate()).forEach(function(d){
    var all=S.shorts.filter(function(x){return x.date===d;}).sort(function(a,b){return a.ts-b.ts;});
    if(all.length<6)return;
    var f=all.slice(0,3).filter(function(x){return x.views!=null;}).map(function(x){return x.views;});
    var l=all.slice(-3).filter(function(x){return x.views!=null;}).map(function(x){return x.views;});
    if(f.length&&l.length){firsts.push(avg(f));lasts.push(avg(l));}
  });
  if(firsts.length){
    var fa=avg(firsts),la=avg(lasts),holds=la>=fa*0.8;
    h+='<div class="insight"><b>First 3 vs last 3 of the day</b><div class="s">First 3 average <span class="v">'+fmt(fa)+'</span>, last 3 average <span class="v">'+fmt(la)+'</span>.</div>'+
       '<div class="s '+(holds?'good':'bad')+'">'+(holds?'Later posts are holding up. You can keep this pace.':'Later posts are dropping off. Try fewer Shorts and a stronger first second.')+'</div></div>';
  }else{
    h+='<div class="insight"><b>First 3 vs last 3 of the day</b><div class="s">Needs a day with 6 or more Shorts and views added to the first and last three.</div></div>';
  }
  return h;
}

function viewLog(){
  var days=Object.keys(countsByDate()).sort().reverse();
  var body='';
  if(!days.length)body='<div class="empty">No Shorts logged yet. Go to Today and tap Log a Short.</div>';
  days.forEach(function(d){
    var list=S.shorts.filter(function(x){return x.date===d;}).sort(function(a,b){return b.ts-a.ts;});
    var v=list.filter(function(x){return x.views!=null;}).reduce(function(a,x){return a+x.views;},0);
    body+='<div class="dayhead"><b>'+fmtDay(d)+'</b><span>'+list.length+' posted'+(v?', '+fmt(v)+' views':'')+'</span></div>'+list.map(shortRow).join('');
  });
  return '<div class="top"><h1>Log</h1><button class="icon-btn" data-act="export">Export</button></div>'+
    '<section style="margin-top:0"><h2>What the numbers say</h2>'+insights()+'</section>'+
    '<section><h2>All Shorts</h2>'+body+'</section>';
}

function sparkline(pts){
  if(pts.length<2)return '';
  var w=300,h=60,p=4,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);
  var xs=pts.map(function(_,i){return p+i*(w-2*p)/(pts.length-1);});
  var ys=pts.map(function(v){return mx===mn?h/2:h-p-(v-mn)*(h-2*p)/(mx-mn);});
  var pl=xs.map(function(x,i){return x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ');
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Subscriber trend"><polyline fill="none" stroke="var(--spark)" stroke-width="2.5" stroke-linejoin="round" points="'+pl+'"/></svg>';
}

function viewGoal(){
  var t=today(),dl=S.settings.deadline,left=diff(t,dl);
  var tg=S.settings.target,v=views90();
  var pct=Math.min(100,v/tg*100);
  var need=Math.max(0,tg-v)/Math.max(1,left);
  var week=loggedViews(addDays(t,-6));
  var subs=currentSubs();
  var subsSorted=S.subs.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var wkNeed=null;
  if(subs!=null&&left>0)wkNeed=Math.max(0,1000-subs)/Math.max(1,left/7);
  function sb(label,goal){
    var p=subs==null?0:Math.min(100,subs/goal*100);
    return '<div class="barlabel"><span>'+label+'</span><span>'+(subs==null?0:subs)+' of '+goal.toLocaleString()+'</span></div><div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div>';
  }
  return '<div class="top"><h1>Goal</h1><button class="icon-btn" data-act="settings">Settings</button></div>'+
  '<div class="hero" style="padding-bottom:6px"><div class="s hint" style="margin:0">Days until '+fmtLong(dl)+'</div>'+
    '<div class="bigdays"><span class="num">'+(left>0?left:0)+'</span><span class="of" style="color:var(--muted)">days left</span></div></div>'+
  '<section><h2>Views in the last 90 days</h2>'+
    '<div class="seg"><button data-act="target" data-v="3000000" class="'+(tg===3000000?'on':'')+'">3M, fan funding</button><button data-act="target" data-v="10000000" class="'+(tg===10000000?'on':'')+'">10M, ad revenue</button></div>'+
    '<div class="barlabel"><span>'+fmt(v)+' so far</span><span>'+fmt(tg)+' target</span></div><div class="bar"><i style="width:'+pct.toFixed(2)+'%"></i></div>'+
    '<div class="hint">Needed per day from here</div><div class="big-need">'+fmt(need)+'</div>'+
    '<div class="hint">Views logged from the last 7 days: '+fmt(week)+'</div>'+
    '<label>Views in last 90 days, from Studio<input id="g-views" type="number" inputmode="numeric" min="0" value="'+(S.studioViews==null?'':S.studioViews)+'" placeholder="Enter the Studio number"></label>'+
    '<div class="note">This number is used for the bar above. Leave it empty to use the views you logged here. Both tiers also need subscribers, and from Feb 1, 2027 the ad revenue tier needs 20M.</div>'+
  '</section>'+
  '<section><h2>Subscribers</h2>'+
    '<div class="big-need">'+(subs==null?'\u2013':subs)+'</div>'+
    sb('Fan funding tier',500)+sb('Ad revenue tier',1000)+
    (wkNeed!=null&&subs<1000?'<div class="hint">To reach 1,000 by '+fmtLong(dl)+', gain about '+Math.ceil(wkNeed)+' a week.</div>':'')+
    sparkline(subsSorted.map(function(x){return x.count;}))+
    '<div class="btn-row"><button class="btn ghost" data-act="subs">Update subscribers</button></div>'+
  '</section>';
}

function render(){
  applyTheme();
  var app=document.getElementById('app');
  app.innerHTML=tab==='today'?viewToday():tab==='log'?viewLog():viewGoal();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-tab')===tab);
  });
}

/* ---------- sheets ---------- */
var overlay=document.getElementById('overlay');
function sheet(html){overlay.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';overlay.hidden=false;}
function closeSheet(){overlay.hidden=true;overlay.innerHTML='';}
function $(id){return document.getElementById(id);}

function logSheet(id){
  var ed=id?S.shorts.filter(function(x){return x.id===id;})[0]:null;
  var series=ed?ed.series:S.settings.series;
  var num=ed?ed.num:nextNum(series);
  var q=ed?ed.q:[false,false,false];
  var labels=['Strong first second','Clear payoff','Follow line at the end'];
  var checks=labels.map(function(l,i){return '<label class="check"><input type="checkbox" id="f-q'+i+'"'+(q[i]?' checked':'')+'>'+l+'</label>';}).join('');
  var results=ed?'<div class="two"><label>Views<input id="f-views" type="number" inputmode="numeric" min="0" value="'+(ed.views==null?'':ed.views)+'"></label>'+
    '<label>Average % viewed<input id="f-avp" type="number" inputmode="decimal" min="0" max="200" value="'+(ed.avp==null?'':ed.avp)+'"></label></div>':'';
  sheet('<h2>'+(ed?'Edit Short':'Log a Short')+'</h2>'+
    '<label>Series name<input id="f-series" value="'+esc(series)+'" placeholder="Tesla Clutch Files"></label>'+
    '<div class="two"><label>Number<input id="f-num" type="number" inputmode="numeric" min="1" value="'+(num||'')+'"></label>'+
    '<label>Hero<input id="f-hero" value="'+esc(ed?ed.hero:'')+'" placeholder="Lancelot"></label></div>'+
    '<label>Title<input id="f-title" value="'+esc(ed?ed.title:'')+'" placeholder="Optional"></label>'+
    '<div class="checks">'+checks+'</div>'+results+
    '<div class="btn-row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-short" data-id="'+(ed?ed.id:'')+'">'+(ed?'Save changes':'Log Short')+'</button></div>'+
    (ed?'<div class="btn-row"><button class="btn danger" data-act="delete-short" data-id="'+ed.id+'">Delete Short</button></div>':''));
  var sf=$('f-series'),nf=$('f-num');
  if(!ed&&sf&&nf){
    var touched=false;
    nf.addEventListener('input',function(){touched=true;});
    sf.addEventListener('input',function(){if(!touched)nf.value=nextNum(sf.value);});
  }
}

function saveShort(id){
  var series=$('f-series').value.trim();
  var num=parseInt($('f-num').value,10);
  var rec={
    series:series,
    num:isNaN(num)?null:num,
    hero:$('f-hero').value.trim(),
    title:$('f-title').value.trim(),
    q:[0,1,2].map(function(i){return $('f-q'+i).checked;})
  };
  if(id){
    var x=S.shorts.filter(function(y){return y.id===id;})[0];
    if(!x)return closeSheet();
    Object.assign(x,rec);
    var v=$('f-views').value,a=$('f-avp').value;
    x.views=v===''?null:Math.max(0,parseInt(v,10));
    x.avp=a===''?null:parseFloat(a);
  }else{
    rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    rec.date=today();
    rec.ts=Date.now();
    rec.views=null;rec.avp=null;
    S.shorts.push(rec);
    S.settings.series=series;
    flash=true;
  }
  save();closeSheet();render();
}

function subsSheet(){
  var cur=currentSubs();
  sheet('<h2>Update subscribers</h2><div class="hint">Check the count in YouTube Studio and enter it here.</div>'+
    '<label>Subscribers<input id="s-count" type="number" inputmode="numeric" min="0" value="'+(cur==null?'':cur)+'"></label>'+
    '<label>Date<input id="s-date" type="date" value="'+today()+'"></label>'+
    '<div class="btn-row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-subs">Save</button></div>');
}
function saveSubs(){
  var c=parseInt($('s-count').value,10),d=$('s-date').value||today();
  if(isNaN(c)||c<0)return;
  S.subs=S.subs.filter(function(x){return x.date!==d;});
  S.subs.push({date:d,count:c});
  save();closeSheet();render();
}

function settingsSheet(){
  var s=S.settings;
  sheet('<h2>Settings</h2>'+
    '<div class="two"><label>Daily goal<input id="c-goal" type="number" inputmode="numeric" min="1" max="20" value="'+s.goal+'"></label>'+
    '<label>Deadline<input id="c-deadline" type="date" value="'+esc(s.deadline)+'"></label></div>'+
    '<label>Default series name<input id="c-series" value="'+esc(s.series)+'" placeholder="Tesla Clutch Files"></label>'+
    '<div class="btn-row"><button class="btn ghost" data-act="theme">Switch to '+(s.theme==='light'?'dark':'light')+' theme</button></div>'+
    '<div class="btn-row"><button class="btn danger" data-act="wipe">Clear all data</button></div>'+
    '<div class="btn-row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-settings">Save</button></div>');
}
function saveSettings(){
  var g=parseInt($('c-goal').value,10);
  if(!isNaN(g))S.settings.goal=Math.min(20,Math.max(1,g));
  var d=$('c-deadline').value;
  if(d)S.settings.deadline=d;
  S.settings.series=$('c-series').value.trim();
  save();closeSheet();render();
}

function exportText(){
  var st=streaks(),L=[];
  L.push('Tesla Gaming tracker export, '+today());
  L.push('Daily goal: '+S.settings.goal+', streak: '+st.cur+' (best '+st.best+')');
  L.push('Subscribers: '+(currentSubs()==null?'not set':currentSubs()));
  L.push('Views last 90 days (Studio): '+(S.studioViews==null?'not set':S.studioViews));
  L.push('Deadline: '+S.settings.deadline);
  L.push('');
  L.push('Shorts (date | time | series #num | title | hero | views | avg % viewed | checks)');
  S.shorts.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(x){
    L.push([x.date,fmtTime(x.ts),(x.series||'-')+(x.num?' #'+x.num:''),x.title||'-',x.hero||'-',x.views==null?'-':x.views,x.avp==null?'-':x.avp,(x.q||[]).filter(Boolean).length+'/3'].join(' | '));
  });
  L.push('');
  L.push('Subscriber history');
  S.subs.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(x){L.push(x.date+': '+x.count);});
  return L.join('\n');
}
function exportSheet(){
  sheet('<h2>Export</h2><div class="hint">Copy this and paste it into a chat to review your numbers.</div>'+
    '<pre class="export" id="x-text">'+esc(exportText())+'</pre>'+
    '<div class="btn-row"><button class="btn ghost" data-act="close">Close</button><button class="btn primary" data-act="copy">Copy</button></div>');
}
function copyExport(btn){
  var txt=exportText();
  function done(ok){btn.textContent=ok?'Copied':'Select the text and copy it';}
  function fallback(){
    try{
      var r=document.createRange();r.selectNodeContents($('x-text'));
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
      done(document.execCommand('copy'));
    }catch(e){done(false);}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done(true);},fallback);}
    else fallback();
  }catch(e){fallback();}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.getAttribute('data-tab');window.scrollTo(0,0);render();return;}
  if(e.target===overlay){closeSheet();return;}
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(act){
    case 'log':logSheet();break;
    case 'edit':logSheet(id);break;
    case 'save-short':saveShort(id);break;
    case 'delete-short':
      if(el.getAttribute('data-armed')){
        S.shorts=S.shorts.filter(function(x){return x.id!==id;});
        save();closeSheet();render();
      }else{el.setAttribute('data-armed','1');el.textContent='Tap again to delete';}
      break;
    case 'close':closeSheet();break;
    case 'clip':S.clips=Math.max(0,S.clips+parseInt(el.getAttribute('data-d'),10));save();var cn=$('clipnum');if(cn)cn.textContent=S.clips;break;
    case 'target':S.settings.target=parseInt(el.getAttribute('data-v'),10);save();render();break;
    case 'subs':subsSheet();break;
    case 'save-subs':saveSubs();break;
    case 'settings':settingsSheet();break;
    case 'save-settings':saveSettings();break;
    case 'theme':S.settings.theme=S.settings.theme==='light'?'dark':'light';save();applyTheme();settingsSheet();break;
    case 'wipe':
      if(el.getAttribute('data-armed')){S=defaults();save();closeSheet();tab='today';render();}
      else{el.setAttribute('data-armed','1');el.textContent='Tap again to erase everything';}
      break;
    case 'export':exportSheet();break;
    case 'copy':copyExport(el);break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='p-hero'){S.nextHero=e.target.value;save();}
  else if(id==='p-win'){S.wins[today()]=e.target.value;save();}
});
document.addEventListener('change',function(e){
  if(e.target.id==='g-views'){
    var v=e.target.value;
    S.studioViews=v===''?null:Math.max(0,parseInt(v,10));
    save();render();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden)closeSheet();});

save();
render();
})();
</script>
</body>
</html>
